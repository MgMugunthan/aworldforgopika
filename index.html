<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7dbe5">
<title>MG × G — A Tiny Courtroom Drama</title>
<style>
:root{--rose:#f4c6d5;--deep:#8e3f60;--wine:#61243e;--gold:#d5a64b;--cream:#fff9f4;--ink:#432638}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
body{background:radial-gradient(circle at 15% 10%,#fff 0,transparent 28%),linear-gradient(135deg,#fbe8ee,#f5d5df 48%,#f9eadc);overflow-x:hidden}
button{font:700 1rem inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 25px;transition:transform .18s,box-shadow .18s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 22px #7e345329}button:active{transform:scale(.97)}
#app{min-height:100svh;display:grid;place-items:center;padding:28px 16px;position:relative;isolation:isolate}
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.petal{position:absolute;top:-40px;color:#c58c45;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(40px,110vh,0) rotate(500deg)}}
.panel{width:min(100%,680px);background:#fffaf6eF;border:1px solid #d9b66d88;border-radius:28px;padding:clamp(24px,5vw,48px);text-align:center;box-shadow:0 22px 65px #72364b20;position:relative;overflow:hidden;animation:appear .5s ease both}
@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.panel:before{content:"";position:absolute;inset:9px;border:1px solid #d9b66d66;border-radius:21px;pointer-events:none}
.kicker{letter-spacing:.22em;text-transform:uppercase;color:#a67a39;font:700 .7rem Arial,sans-serif}
h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1.08;color:var(--wine);margin:18px 0 12px}
h2{font-size:clamp(1.7rem,5vw,2.4rem);color:var(--wine);margin:12px 0}
p{line-height:1.6}.sub{font-size:1.12rem;color:#80576a}
.ornament{color:var(--gold);font-size:1.4rem;letter-spacing:.4em;margin:14px}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.yes{background:linear-gradient(135deg,#b84f77,#8e3f60);color:white}.no{background:#fff;border:1px solid #d8b5c1;color:#75465a}
.primary{background:linear-gradient(135deg,#d8b15c,#b88732);color:#fff}.soft{background:#fff;color:#79475c;border:1px solid #e2c8d1}
.art{width:min(100%,320px);max-height:290px;object-fit:contain;display:block;margin:14px auto 6px;filter:drop-shadow(0 10px 10px #70405220);border-radius:18px}.judge-art{width:min(100%,300px);max-height:245px}.speaker-art{width:92px;height:92px;max-height:none;object-fit:cover;display:inline-block;float:right;margin:0 0 8px 12px;border-radius:14px;vertical-align:middle}.judge-speaker{float:left;margin:0 12px 8px 0}.dialogue:after{content:'';display:block;clear:both}.scene-bg{background:linear-gradient(#fffaf6e8,#fffaf6f2),url('photo_mg/courtroom-background.webp') center/cover;border-radius:20px;padding:8px 14px}.hero-decor{width:min(100%,260px);max-height:150px;object-fit:contain;margin:0 auto 6px;display:block}
.tiny{font: .78rem Arial,sans-serif;color:#9b7c88}
.script{font-size:1.12rem;line-height:1.55}
.dialogue{background:#fff;border:1px solid #edd9df;border-radius:17px;padding:15px 18px;text-align:left;margin:12px 0;box-shadow:0 5px 15px #74374c0a}
.dialogue b{color:#9b4868}.judge-line{background:#fff5e9;border-color:#ead4a6}
.verdict{display:inline-block;padding:9px 18px;border-radius:999px;background:#f8e5ec;color:#8e3f60;font:bold .8rem Arial,sans-serif;letter-spacing:.12em}
.browser{max-width:420px;margin:0 auto 18px;background:white;border:1px solid #e5dce0;border-radius:14px;text-align:left;overflow:hidden;box-shadow:0 8px 20px #49303a12}
.browserbar{background:#f4f1f2;padding:10px 14px;font: .75rem Arial;color:#766a70}.browserbody{padding:18px 22px;font: .9rem Arial;color:#555}.wifi{font-size:2.2rem;color:#a3a0a2}.browserbody h3{font-size:1.1rem;color:#444;margin:10px 0}
.final-line{font-size:clamp(1.3rem,4vw,1.8rem);font-weight:bold;color:var(--wine);margin:10px 0}
.footer{margin-top:24px;color:#ad8c99;font: .72rem Arial,sans-serif}
.confetti{font-size:1.7rem;letter-spacing:.25em}
@media(max-width:430px){#app{padding:14px}.panel{padding:28px 21px}.actions button{min-width:130px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>
<main id="app" aria-live="polite"></main>
<script>
const app=document.getElementById('app');
const petals=document.getElementById('petals');
let activeScreen='home';
let nextScreen='home';

function renderScreen(screen){
  activeScreen=screen;
  nextScreen=screen;
  if(screen==='court') courtPage();
  else if(screen==='jail') jailPage();
  else if(screen==='release') releasePage();
  else if(screen==='yes') yesPage();
  else home();
}

// Keep the opening screen as a real browser-history entry.
history.replaceState({screen:'home'},'',location.pathname+location.search+'#home');

window.addEventListener('popstate',event=>{
  // Android Chrome's system Back button arrives here.
  const screen=(event.state&&event.state.screen)||location.hash.slice(1)||'home';
  renderScreen(screen);
});

// Also support browsers that report fragment navigation separately.
window.addEventListener('hashchange',()=>{
  const screen=location.hash.slice(1)||'home';
  if(screen!==activeScreen) renderScreen(screen);
});
for(let i=0;i<18;i++){const p=document.createElement('span');p.className='petal';p.textContent=['✦','❧','♥','✿'][i%4];p.style.left=(Math.random()*100)+'%';p.style.animationDuration=(9+Math.random()*13)+'s';p.style.animationDelay=(-Math.random()*18)+'s';p.style.fontSize=(12+Math.random()*15)+'px';petals.appendChild(p)}
const button=(label,cls,fn)=>{const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;return b};
function show(markup){
  if(nextScreen!==activeScreen){
    // Each in-page screen becomes a browser-history entry, so Android Back
    // returns to the previous screen instead of leaving Chrome.
    history.pushState({screen:nextScreen},'',location.pathname+location.search+'#'+nextScreen);
    activeScreen=nextScreen;
  }
  app.innerHTML=`<section class="panel">${markup}</section>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
const photo=(file,alt,extra='')=>`<img class="art ${extra}" src="photo_mg/${file}" alt="${alt}" onerror="this.style.display='none'">`;
function home(){nextScreen='home';show(`<div class="kicker">A tiny message from MG</div><div class="ornament">✦ ❧ ✦</div>${photo('rose-bouquet.webp','Rose bouquet','hero-decor')}<h1>Will You Be the G in My MG? 💗</h1><p class="sub">MG has one little question for G...</p><div class="ornament">🌹 ✧ 🌹</div><div class="actions" id="choices"></div><div class="footer">A little rose-gold comedy production · MG</div>`);document.getElementById('choices').append(button('YES 💖','yes',yesPage),button('NO 🙈','no',courtPage))}
function yesPage(){nextScreen='yes';show(`<div class="kicker">A very unexpected connection issue</div><div class="browser"><div class="browserbar">◉ &nbsp; Not secure &nbsp; · · ·</div><div class="browserbody"><div class="wifi">◔̸</div><h3>This site can't be reached</h3><div>Connection lost unexpectedly</div></div></div><h2>WAIT... MG WAS NOT PREPARED FOR THIS! 🤣</h2>${photo('mg-surprised.webp','MG looking surprised')}<p class="final-line">But seriously... ❤️</p><p class="final-line">I'm just a step away from you. 💌</p><div class="footer">— MG 🌹</div>`)}
function courtPage(){nextScreen='court';show(`<div class="kicker">The Court of G · Special Session</div><div class="scene-bg">${photo('judge-courtroom.webp','Judge at the courtroom','judge-art')}<h2>THE PEOPLE vs. MG ⚖️</h2></div><p class="sub">Court is now in session. Please remain dramatically seated.</p>
<div class="dialogue judge-line">${photo('judge-point.webp','Judge pointing sternly','speaker-art judge-speaker')}<b>Judge:</b> MG, you are accused of attempting to enter G's heart without a valid access pass. What do you have to say?</div>
<div class="dialogue">${photo('mg-pleading.webp','MG pleading nervously','speaker-art')}<b>MG:</b> Your Honour, I would like to request 7 days to appeal!</div>
<div class="dialogue judge-line">${photo('judge-angry.webp','Judge ordering an investigation','speaker-art judge-speaker')}<b>Judge:</b> Rejected! Take this fellow for a FULL BODY INVESTIGATION!</div>
<div class="dialogue">${photo('mg-confused.webp','MG confused and asking a question','speaker-art')}<b>MG:</b> Your Honour! But I haven't understood! Investigation?</div>
<div class="dialogue judge-line">${photo('judge-confused.webp','Judge explaining the investigation','speaker-art judge-speaker')}<b>Judge:</b> Yes! We need to investigate how this fellow lost his heart, confidence and self-respect all at the same time!</div>
<div class="dialogue judge-line">${photo('judge-shocked.webp','Judge announcing the investigation result','speaker-art judge-speaker')}<b>Judge:</b> The investigation confirms that G's heart has rejected your access request. Your application has been denied, your appeal has been dismissed, and your self-respect has officially gone missing!</div>
<div class="dialogue">${photo('mg-embarrassed.webp','MG embarrassed and looking down','speaker-art')}<b>MG:</b> Your Honour... is there any way to recover my self-respect?</div>
<div class="dialogue judge-line">${photo('judge-angry.webp','Judge delivering the final warning','speaker-art judge-speaker')}<b>Judge:</b> Case closed! First recover your self-respect, MG. And stop trying to hack into a heart that has already denied access! 😂</div>
<div class="ornament">⚖️ ✦ ⚖️</div><h2>G, shall we put MG in jail for this crime? 😂</h2><div class="actions" id="courtchoices"></div>`);document.getElementById('courtchoices').append(button('YES 🔒','yes',jailPage),button('NO 😇','no',releasePage))}
function jailPage(){nextScreen='jail';show(`<div class="kicker">The Court of G · Final Verdict</div><h2>WAIT... WHAT?! 😭</h2><p class="script">MG DID NOT EXPECT THIS MOVE! 🤣</p>${photo('mg-jail.webp','MG behind jail bars')}<div class="verdict">VERDICT: GUILTY! ⚖️</div><div class="dialogue judge-line"><b>Judge:</b> MG, you are hereby sentenced to... LIFETIME IMPRISONMENT!</div><div class="dialogue"><b>MG:</b> YOUR HONOUR! I ONLY ASKED FOR 7 DAYS TO APPEAL! HOW DID I GET A LIFETIME SENTENCE?! 😭</div><div class="dialogue judge-line"><b>Judge:</b> APPEAL REJECTED! Even your lawyer has left the group! COURT DISMISSED! 😂</div><p class="final-line">MG's self-respect recovery mission has been postponed indefinitely!</p><div class="confetti">🔒 ⚖️ 😂</div>`)}
function releasePage(){nextScreen='release';show(`<div class="kicker">The Court of G · Final Verdict</div><div class="verdict">NOT GUILTY! 🥳</div><h2>MG IS FREE!</h2><div class="confetti">🎉 ✨ 🎊 ✨ 🎉</div>${photo('mg-released.webp','MG celebrating after release')}<div class="dialogue"><b>MG:</b> THANK YOU, YOUR HONOUR! I PROMISE I'LL NEVER FORGET THIS MERCY! 😂</div><div class="dialogue judge-line"><b>Judge:</b> NOW GET OUT BEFORE I CHANGE MY MIND! 🔨</div><h2>😁🎉💚</h2>`)}
home();
</script>
</body>
</html>
